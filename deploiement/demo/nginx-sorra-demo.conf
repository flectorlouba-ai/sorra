# SORRA — démonstration publique : sorra.performyl.com SEULEMENT (aucun autre nom, aucun autre port).
# Limite de débit sur la page de connexion (10 essais par minute et par adresse, rafale de 5).
limit_req_zone $binary_remote_addr zone=sorra_connexion:1m rate=10r/m;

server {
    listen 80;
    server_name sorra.performyl.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-sorra;
    }
    location / {
        return 301 https://sorra.performyl.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sorra.performyl.com;
    ssl_certificate     /etc/letsencrypt/live/sorra.performyl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sorra.performyl.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Rapidité (11/11/2026) : HTTP/2, reprise des sessions TLS, compression des CSS / JS (le HTML l'était déjà)
    http2 on;
    ssl_session_cache   shared:SORRA_SSL:10m;
    ssl_session_timeout 1d;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    access_log /var/log/nginx/sorra_demo_access.log;
    error_log  /var/log/nginx/sorra_demo_error.log;
    client_max_body_size 12m;

    location /static/ {
        alias /var/www/performyl2-demo/app/static/;
        expires 7d;
    }

    location = /auth/connexion {
        limit_req zone=sorra_connexion burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:8008;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:8008;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
