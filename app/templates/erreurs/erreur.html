{% extends '_base.html' %}
{% block titre %}{{ 'Accès refusé' if code == 403 else 'Page introuvable' }}{% endblock %}
{% block icone %}{{ 'lock' if code == 403 else 'question-circle' }}{% endblock %}

{% block contenu %}
<div class="empty-note" style="max-width:520px;">
  <p class="mb-3">{{ message }}</p>
  <a href="{{ url_for('accueil.index') }}" class="btn-new"><i class="bi bi-house-door"></i> Retour à l'accueil</a>
</div>
{% endblock %}
