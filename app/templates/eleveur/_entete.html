{# En-tête de l'éleveur (lot 11) : « 📞 {Prénom de l'agent} » (masqué sans téléphone) et « 👤 Moi ».
   Mot de passe et déconnexion sont dans « Moi ». #}
{% set agent = agent_eleveur() %}
{% if agent %}<a href="tel:{{ agent.telephone|replace(' ', '') }}" class="btn-top btn-entete" data-entete="agent">📞 {{ agent.prenom or agent.nom }}</a>{% endif %}
<a href="{{ url_for('eleveur.moi') }}" class="btn-top btn-entete" data-entete="moi">👤 Moi</a>
